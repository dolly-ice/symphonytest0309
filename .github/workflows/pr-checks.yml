name: pr-checks

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f .github/workflows/pr-checks.yml
          test -f .github/workflows/deploy.yml

      - name: Simulate validation
        run: echo "pr checks passed"
